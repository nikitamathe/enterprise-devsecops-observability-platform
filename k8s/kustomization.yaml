  - name: 340529311540.dkr.ecr.us-east-1.amazonaws.com/auth-service
    newTag: latest
  - name: 340529311540.dkr.ecr.us-east-1.amazonaws.com/transaction-service
    newTag: latest
  - name: 340529311540.dkr.ecr.us-east-1.amazonaws.com/notification-service
    newTag: latest
  - name: 340529311540.dkr.ecr.us-east-1.amazonaws.com/api-gateway
    newTag: latest
  - name: 340529311540.dkr.ecr.us-east-1.amazonaws.com/frontend
    newTag: latest
