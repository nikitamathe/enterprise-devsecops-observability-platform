apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking
  namespace: argocd
spec:
  project: banking
  source:
    repoURL: https://github.com/nikitamathe/enterprise-devsecops-observability-platform
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=false