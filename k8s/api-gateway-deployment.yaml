apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nikitamathe/api-gateway:latest
          ports:
            - containerPort: 8085
          env:
            - name: AUTH_SERVICE_HOST
              value: auth-service
            - name: AUTH_SERVICE_PORT
              value: "8080"
            - name: ACCOUNT_SERVICE_HOST
              value: account-service
            - name: ACCOUNT_SERVICE_PORT
              value: "8080"
            - name: TRANSACTION_SERVICE_HOST
              value: transaction-service
            - name: TRANSACTION_SERVICE_PORT
              value: "8080"
            - name: NOTIFICATION_SERVICE_HOST
              value: notification-service
            - name: NOTIFICATION_SERVICE_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banking
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8085
