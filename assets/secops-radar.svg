<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="scanner-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Clockwise Radar Rotation */
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* Counter-clockwise Dashed Ring */
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    /* Pulse Heartbeat for Shield */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 16px #6366f1); }
    }
    /* Connecting Data Beam Pulses */
    @keyframes beamFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    .radar-sweep {
      transform-origin: 425px 210px;
      animation: spinClockwise 4s linear infinite;
    }
    .orbit-ring {
      transform-origin: 425px 210px;
      animation: spinCounter 16s linear infinite;
    }
    .core-shield {
      transform-origin: 425px 210px;
      animation: pulse 3s ease-in-out infinite;
    }
    .stream-beam {
      stroke-dasharray: 6, 6;
      animation: beamFlow 1.2s linear infinite;
    }
    .badge-card {
      transition: all 0.3s ease;
    }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-weight: 700; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- Deep Dark Tech Canvas -->
  <rect width="850" height="420" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Center Orbit Target Coordinate Grid -->
  <circle cx="425" cy="210" r="140" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <circle cx="425" cy="210" r="105" fill="none" stroke="#334155" stroke-dasharray="4, 4" stroke-width="1"/>
  <circle cx="425" cy="210" r="70" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Rotating Clockwise Radar Beam -->
  <g class="radar-sweep">
    <path d="M 425 210 L 425 70 A 140 140 0 0 1 545 140 Z" fill="url(#scanner-glow)"/>
    <line x1="425" y1="210" x2="425" y2="70" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- Rotating Counter-Clockwise Concentric Tech Ring -->
  <g class="orbit-ring">
    <circle cx="425" cy="210" r="125" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="14 30 50 15" opacity="0.6"/>
  </g>

  <!-- Flow Connecting Beams to Peripheral Sensors -->
  <line x1="215" y1="105" x2="360" y2="180" stroke="#38bdf8" stroke-width="1.5" class="stream-beam" opacity="0.7"/>
  <line x1="635" y1="105" x2="490" y2="180" stroke="#38bdf8" stroke-width="1.5" class="stream-beam" opacity="0.7"/>
  <line x1="215" y1="315" x2="360" y2="240" stroke="#38bdf8" stroke-width="1.5" class="stream-beam" opacity="0.7"/>
  <line x1="635" y1="315" x2="490" y2="240" stroke="#38bdf8" stroke-width="1.5" class="stream-beam" opacity="0.7"/>

  <!-- CENTER CORE: Pulsing Security DevSecOps Shield -->
  <g class="core-shield">
    <polygon points="425,160 465,185 465,235 425,260 385,235 385,185" fill="url(#shield-grad)" stroke="#93c5fd" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Lock / Secure Indicator Icon -->
    <path d="M 420 205 L 420 197 A 5 5 0 0 1 430 197 L 430 205 Z" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <rect x="417" y="205" width="16" height="13" rx="2" fill="#ffffff"/>
    <circle cx="425" cy="211" r="1.5" fill="#1e3a8a"/>
  </g>

  <!-- TOP-LEFT: SAST / Source Code Gate -->
  <g class="badge-card" transform="translate(45, 60)">
    <rect width="210" height="74" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.6"/>
    <text x="18" y="28" fill="#f87171" font-size="14" class="title-text">SonarQube &amp; Gitleaks</text>
    <text x="18" y="46" class="sub-text">Zero Secret Leaks &amp; Code Flaws</text>
    <rect x="18" y="52" width="160" height="15" rx="3" fill="#450a0a"/>
    <text x="24" y="63" fill="#fca5a5" font-size="9" font-family="monospace" font-weight="700">BLOCK ON SECRET/VULN</text>
  </g>

  <!-- TOP-RIGHT: Container Security (SCA) Gate -->
  <g class="badge-card" transform="translate(595, 60)">
    <rect width="210" height="74" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="18" y="28" fill="#38bdf8" font-size="14" class="title-text">Trivy Vulnerability Scan</text>
    <text x="18" y="46" class="sub-text">Docker &amp; Dependency Audit</text>
    <rect x="18" y="52" width="160" height="15" rx="3" fill="#0c4a6e"/>
    <text x="24" y="63" fill="#7dd3fc" font-size="9" font-family="monospace" font-weight="700">CVSS CRITICAL THRESHOLD</text>
  </g>

  <!-- BOTTOM-LEFT: Kubernetes & Cloud Deployment -->
  <g class="badge-card" transform="translate(45, 280)">
    <rect width="210" height="74" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.6"/>
    <text x="18" y="28" fill="#34d399" font-size="14" class="title-text">AWS EKS &amp; Helm 3</text>
    <text x="18" y="46" class="sub-text">NetworkPolicies &amp; RBAC Sealed</text>
    <rect x="18" y="52" width="160" height="15" rx="3" fill="#064e3b"/>
    <text x="24" y="63" fill="#6ee7b7" font-size="9" font-family="monospace" font-weight="700">ZERO-TRUST POD ISOLATION</text>
  </g>

  <!-- BOTTOM-RIGHT: Observability & Distributed Tracing -->
  <g class="badge-card" transform="translate(595, 280)">
    <rect width="210" height="74" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.6"/>
    <text x="18" y="28" fill="#c084fc" font-size="14" class="title-text">Telemetry &amp; Tracing</text>
    <text x="18" y="46" class="sub-text">Prometheus · Tempo · Loki</text>
    <rect x="18" y="52" width="160" height="15" rx="3" fill="#3b0764"/>
    <text x="24" y="63" fill="#d8b4fe" font-size="9" font-family="monospace" font-weight="700">DISTRIBUTED TRACE STREAM</text>
  </g>
</svg>
