{{- if .Values.observability.enabled }}
{{- if .Values.observability.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ include "banking.namespace" . }}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200
        access: proxy
      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ include "banking.namespace" . }}
data:
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: banking
        orgId: 1
        folder: "Banking"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /etc/grafana/provisioning/dashboards
  banking-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
