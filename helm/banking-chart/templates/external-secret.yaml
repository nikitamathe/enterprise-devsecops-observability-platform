{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  namespace: {{ include "banking.namespace" . }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
---
{{- $store := .Values.externalSecrets.storeName }}
{{- $refresh := .Values.externalSecrets.refreshInterval }}
{{- $prefix := .Values.externalSecrets.secretPrefix }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-secret
  namespace: {{ include "banking.namespace" . }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: {{ $prefix }}/mysql-secret
        property: mysql-root-password
    - secretKey: mysql-user
      remoteRef:
        key: {{ $prefix }}/mysql-secret
        property: mysql-user
    - secretKey: mysql-user-password
      remoteRef:
        key: {{ $prefix }}/mysql-secret
        property: mysql-user-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: {{ include "banking.namespace" . }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: jwt-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: {{ $prefix }}/jwt-secret
        property: jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-secret
  namespace: {{ include "banking.namespace" . }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: grafana-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ $prefix }}/grafana-secret
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: {{ $prefix }}/grafana-secret
        property: admin-password
{{- end }}