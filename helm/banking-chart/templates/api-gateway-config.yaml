apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: {{ include "banking.namespace" . }}
data:
  application.yml: |
    server:
      port: 8085

    spring:
      application:
        name: api-gateway
      data:
        redis:
          host: ${REDIS_HOST:redis}
          port: ${REDIS_PORT:6379}
      cloud:
        compatibility-verifier:
          enabled: false
        gateway:
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenish-rate: {{ .Values.redis.rateLimit.replenishRate }}
                redis-rate-limiter.burst-capacity: {{ .Values.redis.rateLimit.burstCapacity }}
                redis-rate-limiter.requested-tokens: 1
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "https://{{ .Values.ingress.host }}"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: auth-service
              uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0

            - id: account-service
              uri: http://${ACCOUNT_SERVICE_HOST:localhost}:${ACCOUNT_SERVICE_PORT:8082}
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=0
                - AuthFilter

            - id: transaction-service
              uri: http://${TRANSACTION_SERVICE_HOST:localhost}:${TRANSACTION_SERVICE_PORT:8083}
              predicates:
                - Path=/api/transactions/**
              filters:
                - StripPrefix=0
                - AuthFilter

            - id: notification-service
              uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:${NOTIFICATION_SERVICE_PORT:8084}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=0
                - AuthFilter

    jwt:
      secret: ${JWT_SECRET:?JWT_SECRET must be set}

    management:
      endpoints:
        web:
          exposure:
            include: health,prometheus
      endpoint:
        health:
          probes:
            enabled: true
      metrics:
        tags:
          application: ${spring.application.name}

    logging:
      level:
        com.banking: INFO
        org.springframework.cloud.gateway: INFO